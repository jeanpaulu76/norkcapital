<style>
/* Layout: app shell — slim demo strip, header bar, content column (max 1180px); wizard = step rail + form; dashboard = main + side column */
:root{
  --bg:#FFFFFF; --surface:#F4F6F4; --card:#FFFFFF; --line:#E1E7E2; --line-2:#CDD6CF;
  --fg:#1D2621; --muted:#5E6A63; --faint:#8A958E;
  --green:#23883A; --green-hi:#4CBE30; --green-soft:#EAF6E7; --on-green:#FFFFFF;
  --ink:#27312C; --on-ink:#FFFFFF;
  --warn:#9A6212; --warn-soft:#FFF5E3; --warn-line:#F1D59B;
  --danger:#B63A28; --danger-soft:#FCEDEA; --danger-line:#F0C3BA;
  --info-soft:#EEF3F7; --info-line:#D3DEE8;
  --shadow:0 1px 2px rgba(20,35,25,.05),0 6px 20px rgba(20,35,25,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#131A16; --card:#18201B; --line:#27312B; --line-2:#35413A;
  --fg:#E7EEE9; --muted:#A0AEA6; --faint:#76837C;
  --green:#52C236; --green-hi:#6BD64F; --green-soft:#1A2C1C; --on-green:#0B120D;
  --ink:#E7EEE9; --on-ink:#0E1311;
  --warn:#E6B45C; --warn-soft:#2A2213; --warn-line:#5A4620;
  --danger:#F08A78; --danger-soft:#2E1813; --danger-line:#5C2C22;
  --info-soft:#17202A; --info-line:#2A3947;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#131A16; --card:#18201B; --line:#27312B; --line-2:#35413A;
  --fg:#E7EEE9; --muted:#A0AEA6; --faint:#76837C;
  --green:#52C236; --green-hi:#6BD64F; --green-soft:#1A2C1C; --on-green:#0B120D;
  --ink:#E7EEE9; --on-ink:#0E1311;
  --warn:#E6B45C; --warn-soft:#2A2213; --warn-line:#5A4620;
  --danger:#F08A78; --danger-soft:#2E1813; --danger-line:#5C2C22;
  --info-soft:#17202A; --info-line:#2A3947;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
@media(max-width:520px){.wrap{padding-inline:16px}}

/* demo strip */
.demo{background:var(--ink);color:var(--on-ink);font-size:12.5px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:7px}
.demo b{font-weight:600}
.demo .roles{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.demo button{background:transparent;border:1px solid color-mix(in srgb,var(--on-ink) 30%,transparent);color:var(--on-ink);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px}
.demo button.on{background:var(--green-hi);border-color:var(--green-hi);color:#0B120D;font-weight:600}

/* header */
.hdr{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);cursor:pointer;background:none;border:0;padding:0}
.brand img{height:34px;width:auto}
.brand .wm{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em}
.brand .wm span{color:var(--green)}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.02em;color:var(--muted);font-weight:500;margin-top:-2px}
.hdr .sp{flex:1}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--green);color:var(--on-green)}
.hcontact{display:flex;gap:14px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.hcontact a{color:var(--fg);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.uchip{display:flex;align-items:center;gap:10px;font-size:13.5px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:12px}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:4px;font-size:13.5px}
.linkbtn:hover{color:var(--fg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid transparent;padding:10px 16px;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--green);color:var(--on-green)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.out{background:var(--card);border-color:var(--line-2);color:var(--fg)}
.btn.out:hover{border-color:var(--green)}
.btn.ghost{background:transparent;color:var(--green);padding-inline:8px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn.lg{padding:15px 22px;font-size:16.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
:focus-visible{outline:2px solid var(--green-hi);outline-offset:2px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:20px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.neu{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.ex{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--faint);border:1px dashed var(--line-2);border-radius:4px;padding:0 5px;margin-left:6px}
.note{border-radius:8px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--info-soft);border:1px solid var(--info-line)}
.note.warn{background:var(--warn-soft);border:1px solid var(--warn-line)}
.note.ok{background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 30%,transparent)}
.page{padding-block:28px 60px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:clamp(24px,3vw,30px)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;margin-bottom:12px;font-size:14px}
.back:hover{color:var(--fg)}

/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:600;color:var(--fg)}
.fld small{font-size:12px;color:var(--muted)}
.req{color:var(--danger)}
.inp,.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:14.5px;min-height:42px}
.fld textarea{min-height:88px;resize:vertical}

/* landing */
.hero{padding-block:56px 36px;border-bottom:1px solid var(--line);background:
  radial-gradient(900px 380px at 85% -10%,color-mix(in srgb,var(--green-hi) 14%,transparent),transparent 70%),var(--bg)}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:28px;max-width:620px}

.startcard{padding:26px;box-shadow:var(--shadow)}

.rolepick button .ic{width:22px;height:22px}
.rolepick button.on{border-color:var(--green);background:var(--green-soft);color:var(--fg);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 22%,transparent)}
.rolepick button.on .ic{color:var(--green)}
.startcard .meta{display:flex;justify-content:center;gap:14px;color:var(--muted);font-size:13px;margin-top:10px;flex-wrap:wrap}
.startcard .meta span{display:inline-flex;gap:5px;align-items:center}
.signas{text-align:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:16px}

.team{display:flex;gap:14px;align-items:flex-start}

.cbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:14px}
.cbtns a{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:8px;padding:9px 6px;text-decoration:none;color:var(--fg);font-size:13px;font-weight:600;text-align:center}

.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:26px;counter-reset:s}

@media(max-width:480px){.steps4{grid-template-columns:1fr}}
.steps4 div{padding:0 18px 0 0;border-top:2px solid var(--line);padding-top:14px;counter-increment:s}
.steps4 div::before{content:counter(s);font-family:var(--f-display);font-weight:700;color:var(--green);font-size:14px;display:block;margin-bottom:6px}

.band{background:var(--surface);border-block:1px solid var(--line)}
.sites{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.foot{padding-block:28px;font-size:13px;color:var(--muted)}

/* sign in */
.authwrap{display:grid;place-items:start center;padding-block:36px 60px}
.auth{width:100%;max-width:440px;padding:28px}

.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;margin:18px 0}
.tabs2 button{border:0;background:transparent;border-radius:7px;padding:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}

.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.rolebadge{display:flex;justify-content:center;margin-top:6px}

/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media(max-width:920px){.dash{grid-template-columns:minmax(0,1fr)}}
.ready .bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:14px 0 18px;border:1px solid var(--line)}
.ready .bar i{display:block;height:100%;background:var(--green);border-radius:99px}

@media(max-width:760px){.rcols{grid-template-columns:1fr}}
.ritem{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}

.qlinks{display:flex;flex-direction:column;gap:8px}

.ql span{font-size:12px;color:var(--muted)}

.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}

/* docs */
.dropband{border:1.5px dashed var(--info-line);background:var(--info-soft);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.dgrid{grid-template-columns:1fr}}
.dcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card);transition:border-color .15s,background .15s}
.dcard.need{border-color:var(--danger-line)}
.dcard.has{border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.dcard.over{background:var(--green-soft);border-color:var(--green)}
.dcard .top{display:flex;gap:10px;align-items:flex-start}
.dcard .di{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--muted);flex:none}
.dcard b{font-size:14px}
.dcard p{font-size:12.5px;color:var(--muted)}
.dcard .up{margin-left:auto}
.files{display:flex;flex-direction:column;gap:4px}
.file{display:flex;gap:8px;align-items:center;font-size:12.5px;background:var(--surface);border-radius:6px;padding:5px 8px;min-width:0}
.file > span:not(.pill){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.file button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0;display:grid}
.upl{position:relative;overflow:hidden}
.fname{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;font-size:12.5px}
.fname:hover{color:var(--green);text-decoration:underline}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:sp 0.9s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.acc > header{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.acc > header .di{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.acc > header b{display:block;font-size:15px}
.acc > header span{font-size:12.5px;color:var(--muted)}
.acc > .body{padding:16px}

/* wizard */
.wiz{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 110px)}
@media(max-width:820px){.wiz{grid-template-columns:1fr}}
.rail{border-right:1px solid var(--line);padding:22px 14px;background:var(--card)}

.rstep{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid transparent;margin-bottom:6px;background:none;width:100%;text-align:left;cursor:default}
@media(max-width:820px){.rstep{flex:none;width:auto;margin:0}}
.rstep .n{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--faint);font-weight:700;font-size:13px;flex:none}
.rstep small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.rstep b{font-size:14px;font-weight:600;color:var(--faint)}
.rstep.cur{border-color:var(--green);background:var(--green-soft)}

.wmain{display:flex;flex-direction:column;background:var(--surface);min-width:0}

.opt.on{border-color:var(--green);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 25%,transparent)}

.affirm{border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;font-weight:500}
.chipb.on{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.tile{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;text-align:center}
.tile svg{width:34px;height:34px;color:var(--muted)}
.tile.on{border-color:var(--green);background:var(--green-soft)}
.tile.on svg{color:var(--green)}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--card)}

td:first-child{white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}

.stagelist{display:flex;flex-direction:column;gap:0}

.sl{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;color:var(--faint)}
.sl.done{color:var(--fg)} .sl.cur{color:var(--fg);font-weight:700}

.center{text-align:center}

const usesEntity = a => a.ex ? !!a.entity : !!a.entity;
const needsRehab = a => !!a.rehab || ['fixflip','construction'].includes(a.purpose);
function applies(a, cond){ if(cond==='rehab') return needsRehab(a); if(cond==='entity') return usesEntity(a); return true; }
function reqKeysFor(a){ const k=[]; CHECK().forEach(g=>g.items.forEach(it=>{ if(it[4]!=='optional' && applies(a,it[4])) k.push(it[0]); })); return k; }
function borrowerMissing(a){ const h=appHave(a); const items=[]; CHECK().forEach(g=>g.items.forEach(it=>{ if(it[3]==='borrower' && it[4]!=='optional' && applies(a,it[4]) && !h.includes(it[0])) items.push(it); })); return items; }
function appHave(a){ if(a.have) return a.have; const h=new Set();
  Object.keys(S.docs).forEach(k=>{ if((S.docs[k]||[]).length) h.add(k); });
  if(S.track.length) h.add('track');
  Object.keys(S.edocs).forEach(k=>{ if((S.edocs[k]||[]).length) h.add(k); });
  const ad=S.appdocs[a.uuid]||{}; Object.keys(ad).forEach(k=>{ if((ad[k]||[]).length) h.add(k); });
  return [...h]; }

function checklistHTML(a, opts={}){
  const h = appHave(a);
  return `<div class="uw">${CHECK().map(g=>{ const rows=g.items.filter(it=>applies(a,it[4])); if(!rows.length) return ''; return `<div class="uwg"><div class="uwt">${g.t}</div>${rows.map(it=>{
      const got=h.includes(it[0]); const pill = got?`<span class="pill ok">${ic('check')} ${L('Received','Recibido')}</span>`: it[3]==='nork'?`<span class="pill neu">${L('Nork requests','Lo pide Nork')}</span>`: it[4]==='optional'?`<span class="pill neu">${L('If applicable','Si aplica')}</span>`:`<span class="pill bad">${L('Missing','Falta')}</span>`;

}

function field(label, path, o={}){

  let ctl;
  if(o.options){
    ctl = `<select ${attrs}><option value="">${L('Select','Selecciona')}</option>${o.options.map(x=>`<option value="${esc(x[0])}" ${String(v)===String(x[0])?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
  } else if(o.type==='textarea'){
    ctl = `<textarea ${attrs} placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`;
  } else {
    ctl = `<input ${attrs} type="${o.type||'text'}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.im?`inputmode="${o.im}"`:''} autocomplete="${o.ac||'off'}">`;

function readiness(){
  const p=S.profile;
  return {
    contact: !!(p.first && p.last && p.phone && p.street && p.city),
    photo: (S.docs.photoId||[]).length>0,
    entity: !!S.entity.name,
    edocs: ['formation','ein','opAgreement'].some(k=>(S.edocs[k]||[]).length),
    members: S.entity.members.length>0,
    track: S.track.length>0 || (S.docs.track||[]).length>0
  };
}

const OUTCOMES = () => [['sold',L('Sold (sale exit)','Vendida (salida por venta)')],['refi',L('Refinanced (refi exit)','Refinanciada (salida por refinanciamiento)')],['rental',L('Holding as rental','En renta')],['rehab',L('Currently rehabbing','En remodelación')]];
function vTrack(){
  if(!U.tdraft) U.tdraft = {street:'',city:'',state:'',zip:'',ptype:'sf',outcome:'sold',price:'',pdate:'',rehab:'',v1:'',d1:'',notes:''};
  const t = U.tdraft, st = U.tstep;
  const names = [L('Address','Dirección'),L('Property','Propiedad'),L('Purchase','Compra'),L('Outcome','Resultado'),L('Details','Detalles'),L('Review','Revisión')];
  const f = (lab, k, o={}) => { const id='t_'+k; const v=t[k]??''; return `<div class="fld ${o.full?'full':''}"><label for="${id}">${lab}${o.req?' <span class="req">*</span>':''}</label>${o.options?`<select id="${id}" data-tbind="${k}" ${o.rr?'data-rr="1"':''}>${o.options.map(x=>`<option value="${x[0]}" ${v===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:o.type==='textarea'?`<textarea id="${id}" data-tbind="${k}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`:(o.prefix?`<div class="pre"><span>$</span>`:'')+`<input id="${id}" data-tbind="${k}" type="${o.type||'text'}" value="${esc(v)}" ${o.im?`inputmode="${o.im}"`:''} autocomplete="off">`+(o.prefix?'</div>':'')}</div>`; };
  const out = {sold:[L('Sale price','Precio de venta'),L('Sale date','Fecha de venta')],refi:[L('Refi appraised value','Valor de avalúo del refinanciamiento'),L('Refi date','Fecha del refinanciamiento')],rental:[L('Current value','Valor actual'),L('Monthly rent','Renta mensual')],rehab:[L('Estimated after-repair value (ARV)','Valor estimado después de remodelar (ARV)'),L('Expected completion','Fecha estimada de terminación')]}[t.outcome];
  let body='';
  if(st===1) body = `<div class="stack" style="gap:14px">${f(L('Street','Calle'),'street',{req:1})}<div class="grid2">${f(L('City','Ciudad'),'city',{req:1})}${f(L('State','Estado'),'state',{req:1})}</div>${f('ZIP','zip',{req:1,im:'numeric'})}</div>`;
  if(st===2) body = `<div class="stack" style="gap:14px">${f(L('Property type','Tipo de propiedad'),'ptype',{options:PTYPES.map(p=>[p[0],L(p[1],p[2])])})}${f(L('What happened with this property?','¿Qué pasó con esta propiedad?'),'outcome',{options:OUTCOMES()})}</div>`;
  if(st===3) body = `<div class="stack" style="gap:14px">${f(L('Purchase price','Precio de compra'),'price',{prefix:1,im:'decimal'})}${f(L('Purchase date','Fecha de compra'),'pdate',{type:'date'})}${f(L('Rehab spent','Gasto en remodelación'),'rehab',{prefix:1,im:'decimal'})}</div>`;
  if(st===4) body = `<div class="stack" style="gap:14px">${f(out[0],'v1',{prefix:1,im:'decimal'})}${t.outcome==='rental'?f(out[1],'d1',{prefix:1,im:'decimal'}):f(out[1],'d1',{type:'date'})}</div>`;
  if(st===5) body = `<div class="stack" style="gap:14px">${f(L('Notes','Notas'),'notes',{type:'textarea',ph:L('Anything that gives context — financing, partners, lessons learned…','Cualquier contexto: financiamiento, socios, lecciones aprendidas…')})}<div class="note info small">${L('You can attach evidence (HUD, ALTA, deed, etc.) after saving.','Puedes adjuntar evidencia (HUD, ALTA, escritura, etc.) después de guardar.')}</div></div>`;
  if(st===6) body = `<dl class="kv"><dt>${L('Address','Dirección')}</dt><dd>${esc([t.street,t.city,t.state,t.zip].filter(Boolean).join(', '))}</dd><dt>${L('Property type','Tipo')}</dt><dd>${esc(L(...PTYPES.find(p=>p[0]===t.ptype).slice(1)))}</dd><dt>${L('Experience','Experiencia')}</dt><dd>${esc(OUTCOMES().find(o=>o[0]===t.outcome)[1])}</dd><dt>${L('Purchase price','Precio de compra')}</dt><dd>${money(t.price)}</dd><dt>${L('Rehab spent','Remodelación')}</dt><dd>${money(t.rehab)}</dd><dt>${out[0]}</dt><dd>${money(t.v1)}</dd></dl>`;
  return `<div class="wrap page" style="max-width:860px">
    ${backTo()}
    <div class="pagehead"><div><h1>${L('Track record','Historial de experiencia')}</h1><p class="muted">${L('Properties you’ve owned, refinanced, or are holding. Your Nork team uses this to verify your investment experience.','Propiedades que has tenido, refinanciado o mantienes. Tu equipo Nork lo usa para verificar tu experiencia como inversionista.')}</p></div></div>
    ${S.track.length?`<div class="tbl-wrap" style="margin-bottom:22px"><table><thead><tr><th>${L('Address','Dirección')}</th><th>${L('Type','Tipo')}</th><th>${L('Experience','Experiencia')}</th><th class="num">${L('Purchase','Compra')}</th><th class="num">${L('Sale / current value','Venta / valor actual')}</th><th></th></tr></thead><tbody>
      ${S.track.map((p,i)=>`<tr><td>${esc([p.street,p.city,p.state].filter(Boolean).join(', '))}</td><td>${esc(L(...PTYPES.find(x=>x[0]===p.ptype).slice(1)))}</td><td>${esc(OUTCOMES().find(o=>o[0]===p.outcome)[1])}</td><td class="num">${money(p.price)}</td><td class="num">${money(p.v1)}</td><td><label class="btn ghost sm upl">${ic('upload')} ${(p.ev||[]).length?`${p.ev.length} ${L('files','archivos')}`:L('Evidence','Evidencia')}<input type="file" multiple data-evidence="${i}" aria-label="${L('Attach evidence','Adjuntar evidencia')}"></label> <button class="btn ghost sm" data-rmtrack="${i}" aria-label="${L('Remove','Quitar')}">${ic('x')}</button></td></tr>`).join('')}
    </tbody></table></div>`:''}
    <div class="center" style="margin-bottom:14px"><b>${S.track.length?L('Add another property','Agregar otra propiedad'):L('Add your first property','Agrega tu primera propiedad')}</b><p class="small muted">${L('Walk through a quick 6-step add. You can switch to a CSV or spreadsheet upload any time.','Completa 6 pasos rápidos. Puedes subir un CSV u hoja de cálculo en cualquier momento.')}</p>
      <label class="btn ghost sm upl" style="margin-top:4px">${L('Or upload a CSV / spreadsheet →','O sube un CSV / hoja de cálculo →')}<input type="file" accept=".csv,.xlsx,.xls" data-upload="docs.track" aria-label="CSV"></label></div>
    <div class="card pad" style="max-width:480px;margin:0 auto">
      <div class="row between small"><span class="muted">${L('Step','Paso')} ${st} ${L('of','de')} 6</span><b>${names[st-1]}</b></div>
      <div class="bar" style="height:5px;background:var(--surface);border-radius:9px;margin:10px 0 18px;overflow:hidden"><i style="display:block;height:100%;width:${st/6*100}%;background:var(--green)"></i></div>
      ${body}
      ${U.err?`<p class="err" style="margin-top:10px">${U.err}</p>`:''}
      <div class="row between" style="border-top:1px solid var(--line);margin-top:18px;padding-top:14px">
        <button class="btn ghost" data-act="tback" ${st===1?'disabled':''}>${ic('back')} ${L('Back','Atrás')}</button>
        ${st<6?`<button class="btn ink" data-act="tnext">${L('Next','Siguiente')} ${ic('arrow')}</button>`:`<button class="btn pri" data-act="tsave">${ic('check')} ${L('Save property','Guardar propiedad')}</button>`}
      </div>
    </div></div>`;
}

/* ---------- helpers ---------- */
function go(v){ U.view=v; U.err=''; U.modal=null; render(); window.scrollTo(0,0); }
const needsAuth = ['dash','profile','docs','entity','track','payoff','letter','apply'];
async function must(p){ const r = await p; if(r.error) throw r.error; return r.data; }
const num = v => { if(v===''||v==null) return null; const n=Number(String(v).replace(/[^0-9.]/g,'')); return isNaN(n)?null:n; };
const int = v => { const n=num(v); return n==null?null:Math.round(n); };
const PMAP = {first:'first_name',last:'last_name',occupation:'occupation',ssn4:'ssn_last4',dob:'date_of_birth',marital:'marital_status',residency:'residency_status',phone:'phone',sms:'sms_opt_in',street:'street',unit:'unit',city:'city',state:'state',zip:'zip',brokerage:'brokerage',license:'license_number'};
const estAmount = r => { const price=Number(r.price||0), reh=r.rehab_needed?Number(r.rehab_amount||0):0; return Math.round(price*(['refi','cashout','dscr'].includes(r.loan_purpose)?0.75:0.9)+reh); };
const fileItem = d => ({id:d.id, name:d.file_name, kb:Math.max(1,Math.round((d.size_bytes||0)/1024)), path:d.storage_path, type:d.doc_type});
const safeName = n => n.normalize('NFKD').replace(/[^\w.\-]+/g,'_').slice(-120);
function errText(e){
  const m = (e && (e.message || e.error_description || e.msg)) || '';
  const map = [
    [/invalid login credentials/i, L('Email or password is not correct.','El email o la contraseña no son correctos.')],
    [/email not confirmed/i, L('Please confirm your email first — check your inbox for our link.','Primero confirma tu email: revisa tu bandeja de entrada.')],
    [/already registered|already been registered/i, L('That email already has an account. Sign in instead.','Ese email ya tiene cuenta. Mejor ingresa.')],
    [/rate limit|too many/i, L('Too many attempts. Please wait a minute and try again.','Demasiados intentos. Espera un minuto e inténtalo de nuevo.')],
    [/password should|weak password|password is known/i, L('Choose a stronger password: 8+ characters with upper and lower case and a number.','Elige una contraseña más segura: 8+ caracteres con mayúsculas, minúsculas y un número.')],
    [/token has expired|otp.*(expired|invalid)|invalid.*otp/i, L('That code is wrong or expired. Request a new one.','Ese código es incorrecto o venció. Pide uno nuevo.')],
    [/mime type|not supported/i, L('That file type isn’t allowed. Please upload a PDF, image, Word or Excel file.','Ese tipo de archivo no está permitido. Sube un PDF, imagen, Word o Excel.')],
    [/exceeded the maximum allowed size|too large/i, L('That file is over 10 MB.','Ese archivo pesa más de 10 MB.')],
    [/failed to fetch|network/i, L('Can’t reach the server. Check your internet connection.','No se puede conectar al servidor. Revisa tu internet.')]
  ];
  for(const [re,t] of map) if(re.test(m)) return t;
  return m || L('Something went wrong. Please try again.','Algo salió mal. Inténtalo de nuevo.');
}
function fail(e){ console.error(e); toast(errText(e)); }

/* ---------- data loading ---------- */
async function loadAll(){
  const uid=S.uid;
  const me = await must(sb.from('profiles').select('*').eq('id',uid).single());
  S.me=me; S.role = (me.role==='admin'||me.role==='team') ? 'team' : me.role; S.email=me.email||S.email;
  const p=blankProfile(); Object.entries(PMAP).forEach(([k,c])=>{ p[k]= me[c]==null ? (k==='sms'?false:'') : me[c]; }); p.email=me.email||''; S.profile=p;
  const [docs, ents, tr, apps, pays, lets] = await Promise.all([
    must(sb.from('documents').select('*').eq('owner_id',uid).order('uploaded_at')),
    must(sb.from('entities').select('*, entity_members(*)').eq('owner_id',uid).order('created_at')),
    must(sb.from('track_records').select('*').eq('owner_id',uid).order('created_at')),
    must(sb.from('applications').select('*').eq('borrower_id',uid).order('created_at')),
    must(sb.from('payoff_requests').select('*').eq('requester_id',uid).order('created_at',{ascending:false})),
    must(sb.from('letter_requests').select('*').eq('requester_id',uid).order('created_at',{ascending:false}))
  ]);
  const e = ents[0];
  S.entity = e ? {id:e.id, name:e.legal_name||'', type:e.entity_type||'', state:e.state_of_formation||'', ein:e.ein||'', formed:e.formed_on||'', members:(e.entity_members||[]).map(m=>({id:m.id,name:m.full_name,email:m.email||'',pct:m.ownership_pct,role:m.member_role||''}))} : blankEntity();
  S.docs={}; S.edocs={}; S.appdocs={}; const ev={};
  const pending = new Set((S.draft && S.draft.tdocIds) || []);
  docs.forEach(d=>{ const f=fileItem(d);
    if(d.track_record_id){ (ev[d.track_record_id]=ev[d.track_record_id]||[]).push(f); return; }
    if(d.application_id){ const a=(S.appdocs[d.application_id]=S.appdocs[d.application_id]||{}); (a[d.doc_type]=a[d.doc_type]||[]).push(f); return; }
    if(pending.has(d.id)) return;
    if(d.entity_id){ (S.edocs[d.doc_type]=S.edocs[d.doc_type]||[]).push(f); return; }
    (S.docs[d.doc_type]=S.docs[d.doc_type]||[]).push(f); });
  S.track = tr.map(r=>({id:r.id, street:r.street||'', city:r.city||'', state:r.state||'', zip:r.zip||'', ptype:r.property_type||'sf', outcome:r.outcome||'sold', price:r.purchase_price, pdate:r.purchase_date, rehab:r.rehab_spent, v1:r.outcome_value, d1:r.outcome==='rental'?r.monthly_rent:r.outcome_date, notes:r.notes, ev:ev[r.id]||[]}));
  S.apps = apps.map(r=>{ if(!S.appdocs[r.id]) S.appdocs[r.id]={}; return {uuid:r.id, id:r.file_number, addr:[r.property_address, r.property_unit].filter(Boolean).join(' #'), purpose:r.loan_purpose, amount:estAmount(r), stage:r.status, entity:!!r.entity_id, rehab:!!r.rehab_needed, realtor:r.realtor_email||'', created:r.created_at}; });
  S.payoffs = pays.map(r=>({id:r.id, loan:r.loan_number, addr:r.property_address, from:r.good_from, to:r.good_through, date:(r.created_at||'').slice(0,10), status:r.status}));
  S.letters = lets.map(r=>({id:r.id, addr:r.property_address, price:r.offer_price, status:r.status}));
  if(S.role==='team') await loadTeam();
  if(S.role==='realtor' && me.approved) await loadRealtor();
}
async function loadTeam(){
  const [apps, docs, tr, pays, lets, people] = await Promise.all([
    must(sb.from('applications').select('*').order('created_at',{ascending:false})),
    must(sb.from('documents').select('*').order('uploaded_at')),
    must(sb.from('track_records').select('owner_id')),
    must(sb.from('payoff_requests').select('*').order('created_at',{ascending:false})),
    must(sb.from('letter_requests').select('*').order('created_at',{ascending:false})),
    must(sb.from('profiles').select('*').order('created_at',{ascending:false}))
  ]);
  const byId = Object.fromEntries(people.map(p=>[p.id,p]));
  const trOwners = new Set(tr.map(t=>t.owner_id));
  const nm = p => p ? (((p.first_name||'')+' '+(p.last_name||'')).trim() || p.email) : '';
  S.team.people = people;
  S.team.apps = apps.map(r=>{ const b=byId[r.borrower_id]; const rel=r.realtor_id?byId[r.realtor_id]:null;
    const files = docs.filter(d=>d.owner_id===r.borrower_id && !d.track_record_id && (!d.application_id || d.application_id===r.id));
    const have = new Set(files.map(d=>d.doc_type)); if(trOwners.has(r.borrower_id)) have.add('track');
    return {uuid:r.id, id:r.file_number, borrowerId:r.borrower_id, borrower: nm(b) || ((r.contact_first||'')+' '+(r.contact_last||'')).trim(),
      phone:r.contact_phone||(b&&b.phone)||'', email:r.contact_email||(b&&b.email)||'', addr:[r.property_address,r.property_unit].filter(Boolean).join(' #'),
      purpose:r.loan_purpose, amount:estAmount(r), stage:r.status, credit:r.credit_range, props:r.properties_owned,
      realtor: rel?nm(rel):(r.realtor_email||''), entity:!!r.entity_id, rehab:!!r.rehab_needed, have:[...have], files, strategy:r.strategy, created:(r.created_at||'').slice(0,10)}; });
  S.team.payoffs = pays.map(r=>({...r, requester: nm(byId[r.requester_id])}));
  S.team.letters = lets.map(r=>({...r, requester: nm(byId[r.requester_id])}));
}
async function loadRealtor(){
  const rows = await must(sb.rpc('realtor_pipeline'));
  S.realtorApps = (rows||[]).map(r=>({id:r.file_number, uuid:r.file_number, borrower:r.borrower_name, addr:r.property_address||'', purpose:r.loan_purpose, stage:r.status,
    amount: estAmount({price:r.price, rehab_needed:r.rehab_needed, rehab_amount:r.rehab_amount, loan_purpose:r.loan_purpose}), entity:!!r.uses_entity, rehab:!!r.rehab_needed, have:r.docs_received||[]}));
}

/* ---------- auth ---------- */
async function onAuth(event, session){
  if(event==='PASSWORD_RECOVERY'){ U.recovery=true; if(session) S.uid=session.user.id; return go('newpw'); }
  if(event==='TOKEN_REFRESHED' || event==='USER_UPDATED') return;
  if(!session){
    const keep={lang:S.lang, draft:S.draft, ref:S.ref, afterAuth:S.afterAuth}; S=fresh(); Object.assign(S,keep);
    if(U.view!=='checkemail') go('landing'); return;
  }
  if(S.uid===session.user.id && S.me) return;

  if(U.recovery) return go('newpw');

/* ---------- files ---------- */
async function addFiles(path, fileList){
  if(!S.uid) return;
  const parts=path.split('.'); const key=parts[parts.length-1];
  const meta={owner_id:S.uid, doc_type:key};
  if(parts[0]==='edocs'){ if(!S.entity.id){ toast(L('Save the entity first, then upload its documents.','Guarda primero la entidad y luego sube sus documentos.')); return; } meta.entity_id=S.entity.id; }
  if(parts[0]==='appdocs') meta.application_id=parts[1];
  const list = getP(S,path) || []; let skipped=0, done=0;
  for(const f of fileList){
    if(f.size>10*1024*1024){ skipped++; continue; }
    const p=`${S.uid}/${key}/${Date.now()}-${safeName(f.name)}`;
    try{
      toast(L('Uploading','Subiendo')+' '+f.name+'…');
      await must(sb.storage.from(BUCKET).upload(p, f, {contentType:f.type||'application/octet-stream', upsert:false}));
      const row = await must(sb.from('documents').insert({...meta, storage_path:p, file_name:f.name, size_bytes:f.size}).select().single());
      list.push(fileItem(row)); done++;
      if(parts[0]==='draft'){ S.draft.tdocIds=(S.draft.tdocIds||[]); S.draft.tdocIds.push(row.id); }
    }catch(e){ fail(e); }
  }
  setP(S,path,list); save(); render();
  if(done) toast(L('Uploaded','Subido')+' ('+done+')');
  if(skipped) toast(L('Files over 10 MB were skipped.','Se omitieron archivos de más de 10 MB.'));
}
async function removeFile(path, i){
  const arr=getP(S,path)||[]; const f=arr[i]; if(!f) return;
  try{ await must(sb.storage.from(BUCKET).remove([f.path])); await must(sb.from('documents').delete().eq('id',f.id));
    arr.splice(i,1); if(S.draft && S.draft.tdocIds) S.draft.tdocIds=S.draft.tdocIds.filter(x=>x!==f.id); save(); render(); toast(L('File removed','Archivo eliminado')); }catch(e){ fail(e); }
}
async function signedUrl(path, download){ const opts = download ? {download} : undefined; return (await must(sb.storage.from(BUCKET).createSignedUrl(path, 600, opts))).signedUrl; }
async function openFile(path){ const w=window.open('', '_blank'); try{ const u=await signedUrl(path); if(w) w.location=u; else location.href=u; }catch(e){ if(w) w.close(); fail(e); } }
function saveBlob(url, name){ const a=document.createElement('a'); a.href=url; a.download=name||''; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }
async function downloadDocs(appUuid, key){
  const a=S.team.apps.find(x=>x.uuid===appUuid); if(!a) return;
  const files=a.files.filter(f=>f.doc_type===key);
  if(!files.length) return toast(L('This item was entered online (no file). See Track Record.','Este dato se ingresó en línea (sin archivo).'));
  try{ for(const f of files){ saveBlob(await signedUrl(f.storage_path, f.file_name), f.file_name); } }catch(e){ fail(e); }
}
async function downloadZip(appUuid){
  const a=S.team.apps.find(x=>x.uuid===appUuid); if(!a) return;
  if(!a.files.length) return toast(L('No files uploaded yet.','Aún no hay archivos.'));
  if(!window.JSZip) return toast(L('ZIP tool didn’t load. Download files one by one.','No cargó la herramienta ZIP. Descarga uno por uno.'));
  toast(L('Preparing ZIP…','Preparando ZIP…'));
  try{ const zip=new JSZip();
    for(const f of a.files){ const u=await signedUrl(f.storage_path); const b=await (await fetch(u)).blob(); zip.file(`${f.doc_type}/${f.file_name}`, b); }
    const blob=await zip.generateAsync({type:'blob'}); const url=URL.createObjectURL(blob); saveBlob(url, `${a.id}-${safeName(a.borrower||'borrower')}.zip`); setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ fail(e); }
}
async function teamUpload(appUuid, key, files){
  const a=S.team.apps.find(x=>x.uuid===appUuid); if(!a) return;
  try{ for(const f of files){ if(f.size>10*1024*1024){ toast(L('Files over 10 MB were skipped.','Se omitieron archivos de más de 10 MB.')); continue; }
      const p=`${a.borrowerId}/${key}/${Date.now()}-${safeName(f.name)}`;
      await must(sb.storage.from(BUCKET).upload(p, f, {contentType:f.type||'application/octet-stream'}));
      await must(sb.from('documents').insert({owner_id:a.borrowerId, application_id:a.uuid, doc_type:key, storage_path:p, file_name:f.name, size_bytes:f.size})); }
    await loadTeam(); render(); toast(L('Uploaded to the borrower’s file','Subido al expediente del prestatario'));
  }catch(e){ fail(e); }
}
function copyText(txt, okMsg){
  const done=()=>toast(okMsg||L('Copied','Copiado'));
  try{ navigator.clipboard.writeText(txt).then(done, ()=>window.prompt(L('Copy this link:','Copia este enlace:'), txt)); }catch(e){ window.prompt(L('Copy this link:','Copia este enlace:'), txt); }

      const d=S.payoffDraft;
      if(!d.loan||!d.addr||!d.name||!d.phone||!d.email||!d.from||!d.to||!d.sign){ U.err=L('Please complete all required fields (*).','Completa todos los campos obligatorios (*).'); return render(); }
      if(d.to<d.from){ U.err=L('“Good through” must be on or after “Good from”.','“Válido hasta” debe ser igual o posterior a “Válido desde”.'); return render(); }
      if(d.sendTo!=='me' && (!d.tcName||!d.tcEmail)){ U.err=L('Add the name and email of who should receive the payoff.','Agrega nombre y email de quien recibirá el pago total.'); return render(); }
      if(!d.auth){ U.err=L('Check the authorization box to continue.','Marca la casilla de autorización para continuar.'); return render(); }
      await must(sb.from('payoff_requests').insert({requester_id:S.uid, loan_number:d.loan, property_address:d.addr, borrower_name:d.name, entity_name:d.entity||null, phone:d.phone, email:d.email,
        good_from:d.from, good_through:d.to, reason:d.reason||null, expected_closing:d.close||null, send_to:d.sendTo, third_party_name:d.tcName||null, third_party_contact:d.tcContact||null,
        third_party_email:d.tcEmail||null, third_party_phone:d.tcPhone||null, third_party_file_number:d.tcFile||null, notes:d.notes||null, signature_name:d.sign, authorized:true}));
      S.payoffDraft=null; await reload(); window.scrollTo(0,document.body.scrollHeight); return toast(L('Payoff request sent to the Nork team.','Solicitud de pago total enviada al equipo Nork.'));
    }
    if(f==='letter'){
      const d=S.letterDraft; if(!d.addr||!num(d.price)){ U.err=L('Add the property and offer price.','Agrega la propiedad y el precio de oferta.'); return render(); }
      await must(sb.from('letter_requests').insert({requester_id:S.uid, property_address:d.addr, offer_price:num(d.price), loan_amount:num(d.loan), needed_by:d.by||null, addressed_to:d.to||null, notes:d.notes||null}));
      S.letterDraft=null; await reload(); return toast(L('Letter request sent to the Nork team.','Solicitud de carta enviada al equipo Nork.'));
    }
  }catch(err){ U.err=errText(err); render(); }
});

/* drag & drop onto doc cards */
document.addEventListener('dragover', e => { const c=e.target.closest('[data-drop]'); if(c){ e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c=e.target.closest('[data-drop]'); if(c) c.classList.remove('over'); });
document.addEventListener('drop', e => { const c=e.target.closest('[data-drop]'); if(c){ e.preventDefault(); c.classList.remove('over'); if(e.dataTransfer.files.length) addFiles(c.dataset.drop, [...e.dataTransfer.files]); } });
document.addEventListener('keydown', e => { if(e.key==='Escape' && U.modal){ U.modal=null; render(); } });

/* ---------- boot ---------- */
(function boot(){
  const ref = new URLSearchParams(location.search).get('ref'); if(ref){ S.ref=ref; save(); }
  render();
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => onAuth(event, session), 0); });
})();

</script>
</body></html>
